<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIDN</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', monospace;
    }

    body {
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .terminal {
      width: 90%;
      max-width: 700px;
      background: #0a0a0a;
      border: 1px solid #1f1f1f;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 40px rgba(0, 150, 255, 0.1);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 220px;
      height: auto;
      max-width: 80%;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 25px rgba(0, 198, 255, 0.7));
    }

    .line {
      font-size: 1rem;
      margin: 6px 0;
      color: #8ab4f8;
      white-space: pre;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      background: #00ff9c;
      margin-left: 5px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }

    .prompt {
      color: #00ff9c;
    }

    .highlight {
      color: #00c6ff;
    }
  </style>
</head>

<body>
  <div class="terminal">

    <div class="logo">
      <img src="logo.png" alt="AIDN">
    </div>

    <div id="output"></div>

  </div>

  <script>
    const lines = [
      "> initializing AIDN...",
      "loading modules ██████████ 100%",
      "establishing network...",
      "deploying intelligence layer...",
      "system status: under development",
      "",
      "AIDN is currently being built.",
      "We're working on something powerful.",
      "Check back soon."
    ];

    const output = document.getElementById("output");

    let lineIndex = 0;
    let charIndex = 0;

    function typeLine() {
      if (lineIndex >= lines.length) return;

      if (!output.lastChild || !output.lastChild.classList.contains("line")) {
        const div = document.createElement("div");
        div.className = "line";
        output.appendChild(div);
      }

      const currentLine = lines[lineIndex];
      const currentDiv = output.lastChild;

      if (charIndex < currentLine.length) {
        currentDiv.textContent += currentLine.charAt(charIndex);
        charIndex++;
        setTimeout(typeLine, 25);
      } else {
        lineIndex++;
        charIndex = 0;
        setTimeout(typeLine, 400);
      }
    }

    typeLine();
  </script>

</body>
</html>
