<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIDN</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #0a0f1c;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .container {
      z-index: 2;
    }

    img {
      width: 120px;
      margin-bottom: 25px;
      filter: drop-shadow(0 0 15px rgba(0, 114, 255, 0.6));
    }

    h1 {
      font-size: 2.8rem;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
    }

    p {
      color: #a0b3d6;
      font-size: 1.1rem;
      max-width: 500px;
      line-height: 1.6;
    }

    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,114,255,0.15), transparent);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.85rem;
      color: #5f6b85;
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <div class="container">
    <!-- Replace logo.png with your uploaded logo filename -->
    <img src="logo.png" alt="AIDN Logo" />

    <h1>We’re Building Something Big</h1>

    <p>
      AIDN is currently under development.<br />
      We’re working on something powerful.<br />
      Check back soon.
    </p>
  </div>

  <div class="footer">
    © 2026 AIDN
  </div>
</body>
</html>
