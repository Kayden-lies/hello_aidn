<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIDN</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', monospace;
    }

    body {
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .terminal {
      width: 90%;
      max-width: 700px;
      background: #0a0a0a;
      border: 1px solid #1f1f1f;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 40px rgba(0, 150, 255, 0.1);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 80px;
      opacity: 0.9;
    }

    .line {
      font-size: 1rem;
      margin: 8px 0;
      color: #8ab4f8;
    }

    .prompt {
      color: #00ff9c;
    }

    .typing::after {
      content: "|";
      animation: blink 1s infinite;
      margin-left: 5px;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }

    .status {
      margin-top: 15px;
      color: #aaa;
      font-size: 0.95rem;
    }

    .highlight {
      color: #00c6ff;
    }
  </style>
</head>

<body>
  <div class="terminal">

    <div class="logo">
      <img src="logo.png" alt="AIDN">
    </div>

    <div class="line"><span class="prompt">> initializing AIDN...</span></div>
    <div class="line">loading modules ██████████ 100%</div>
    <div class="line">establishing network...</div>
    <div class="line">deploying intelligence layer...</div>

    <div class="line typing"><span class="highlight">system status:</span> under development</div>

    <div class="status">
      AIDN is currently being built.<br/>
      We're working on something powerful.<br/>
      Check back soon.
    </div>

  </div>
</body>
</html>
