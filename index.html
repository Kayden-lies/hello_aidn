<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AIDN</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: "Courier New", monospace;
}

/* TERMINAL */
.terminal {
  flex: 1;
  max-width: 800px;
  width: 90%;
  margin: auto;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #1f2a3a;
  box-shadow: 0 0 60px rgba(0,150,255,0.15);
  display: flex;
  flex-direction: column;
}

/* HEADER */
.terminal-header {
  background: linear-gradient(180deg, #0b1a2a, #08121f);
  padding: 10px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #1f2a3a;
}

/* LEFT */
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.console-icon {
  color: #00c6ff;
  font-weight: bold;
}

.title {
  color: #9fb3c8;
  font-size: 0.9rem;
}

/* RIGHT DOTS */
.header-right {
  display: flex;
  gap: 8px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.red { background: #ff5f56; }
.yellow { background: #ffbd2e; }
.green { background: #27c93f; }

/* BODY */
.terminal-body {
  background: #050b14;
  padding: 20px;
  overflow-y: auto;
  overflow-x: auto;
  flex: 1;
}

/* TEXT */
.line {
  margin: 4px 0;
  white-space: pre;
  line-height: 1.2;
}

.blue { color:#00c6ff; }
.green { color:#00ff9c; }
.dim { color:#8a9bb0; }

/* INPUT */
.input-line {
  display: flex;
}

.prompt {
  color: #00ff9c;
  margin-right: 5px;
}

/* BLINKING CURSOR */
input {
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  flex: 1;
  caret-color: #00ff9c;
  animation: blinkCursor 1s infinite;
}

@keyframes blinkCursor {
  0%, 50%, 100% { opacity: 1; }
  25%, 75% { opacity: 0.2; }
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 15px;
  border-top: 1px solid #1f2a3a;
}

.footer img {
  width: 100px;
  opacity: 0.8;
  display: block;
  margin: 0 auto 5px;
}

.footer p {
  font-size: 0.75rem;
  color: #5f6b85;
}
</style>
</head>

<body>

<div class="terminal">

  <div class="terminal-header">
    <div class="header-left">
      <span class="console-icon">&gt;_</span>
      <span class="title">AIDN System Console</span>
    </div>

    <div class="header-right">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
  </div>

  <div id="terminal" class="terminal-body"></div>

</div>

<div class="footer">
  <img src="logo.png" />
  <p>© 2026 AIDN · Built in Pune</p>
</div>

<script>
const terminal = document.getElementById("terminal");

const commands = [
  "help","about","status","links","contact",
  "whoami","aidn","version","uptime","clear"
];

let history = [];
let historyIndex = -1;

/* ADD LINE */
function addLine(text, cls="line") {
  const div = document.createElement("div");
  div.className = cls;
  div.innerHTML = text;
  terminal.appendChild(div);
  terminal.scrollTop = terminal.scrollHeight;
}

/* TYPE */
async function typeLine(text, cls="line") {
  const div = document.createElement("div");
  div.className = cls;
  terminal.appendChild(div);

  for (let i = 0; i < text.length; i++) {
    div.innerHTML += text[i];
    await sleep(12);
  }

  terminal.scrollTop = terminal.scrollHeight;
}

/* ASCII */
function showLogo(){
  addLine("");
  addLine(
`   █████╗   ██╗ ██████╗  ███╗   ██╗
  ██╔══ ██╗ ██║ ██╔══██╗ ████╗  ██║
  █████ ██║ ██║ ██║  ██║ ██╔██╗ ██║
  ██╔══ ██║ ██║ ██║  ██║ ██║╚██╗██║
  ██║   ██║ ██║ ██████╔╝ ██║ ╚████║
  ╚═╝     ╚═╝╚═╝╚═════╝ ╚═╝  ╚═══╝`
  ,"line blue");
  addLine("");
}

/* STATUS */ function showStatus(){ addLine(""); addLine("STATUS REPORT","blue"); addLine("─────────────","dim"); addLine("Environment : development"); addLine("Access : restricted"); addLine("Deployment : unavailable"); addLine(""); addLine("System Layers","blue"); addLine("─────────────","dim"); addLine("Core Layer : initializing"); addLine("AI Layer : in development"); addLine("Network Layer : configuring"); addLine("Interface Layer : minimal"); addLine(""); addLine("Overall State : active (development mode)","green"); addLine(""); }

/* COMMANDS */
function handleCommand(cmd){
  cmd = cmd.toLowerCase();

  if(cmd==="help"){
    addLine("");
    addLine(commands.join(", "),"dim");
    addLine("");
  }

  else if(cmd==="about"){
    addLine("");
    addLine("AIDN is a community of developers, creators, and innovators exploring the future of AI. Built in Pune, we focus on learning, building, and collaborating on real-world ideas.","blue");
    addLine("From discussions to projects, we aim to create a space where people don’t just consume AI but actually build with it.","dim");
    addLine("");
  }

  else if(cmd==="status"){ showStatus(); }

  else if(cmd==="links"){
    addLine("");
    addLine('<a href="https://www.instagram.com/aidn_pune" target="_blank">Instagram - @aidn_pune</a>');
    addLine('<a href="https://www.meetup.com/pune-new-technology-meetup-group" target="_blank">Meetup - @Artificial Intelligence Developer Network Pune</a>');
    addLine('<a href="https://www.commudle.com/communities/aisf-vit-pune" target="_blank">Commudle - @Artificial Intelligence Developer Network Pune</a>');
    addLine('<a href="https://linkedin.com/company/aidn-pune" target="_blank">LinkedIn -v @Artificial Intelligence Developer Network Pune</a>');
    addLine("");
  }

  else if(cmd==="contact"){
    addLine("");
    addLine("ai.dev.network.pune@gmail.com","dim");
    addLine("");
  }

  else if(cmd==="whoami"){
    addLine("");
    addLine("visitor@aidn","dim");
    addLine("");
  }

  else if(cmd==="aidn"){
    showLogo();
  }

  else if(cmd==="version"){
    addLine("");
    addLine("v0.1.0-dev","dim");
    addLine("");
  }

  else if(cmd==="uptime"){
    const start = new Date("2026-06-07T00:00:00");
    const now = new Date();
    const diff = now - start;

    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff / (1000*60*60)) % 24);
    const m = Math.floor((diff / (1000*60)) % 60);

    addLine("");
    addLine(`uptime: ${d}d ${h}h ${m}m`,"dim");
    addLine("");
  }

  else if(cmd==="clear"){
    fakeReboot();
  }

  else{
    addLine("");
    addLine("command not found","dim");
    addLine("");
  }
}

/* INPUT */
function createInput(){
  const line=document.createElement("div");
  line.className="input-line";

  line.innerHTML=`<span class="prompt">PS C:\\AIDN></span><input/>`;
  terminal.appendChild(line);

  const input=line.querySelector("input");
  input.focus();

  input.addEventListener("keydown",e=>{

    if(e.key==="Enter"){
      const value=input.value;
      history.push(value);
      historyIndex=history.length;

      line.innerHTML=`<span class="prompt">PS C:\\AIDN></span> ${value}`;
      handleCommand(value);
      createInput();
    }

    if(e.key==="ArrowUp"){
      if(historyIndex>0){
        historyIndex--;
        input.value=history[historyIndex];
      }
    }

    if(e.key==="ArrowDown"){
      if(historyIndex<history.length-1){
        historyIndex++;
        input.value=history[historyIndex];
      } else input.value="";
    }

    if(e.key==="Tab"){
      e.preventDefault();
      const val=input.value;
      const match=commands.find(c=>c.startsWith(val));
      if(match) input.value=match;
    }

  });
}

/* REBOOT */
async function fakeReboot(){
  terminal.innerHTML = "";
  await sleep(100);
  boot();
}

/* BOOT */
async function boot(){

  await typeLine("Initializing AIDN environment...","dim");
  await sleep(200);

  await typeLine("Loading core systems...","dim");
  await sleep(200);

  await typeLine("────────────────────────────","dim");

  showLogo();

  await typeLine("AIDN is still under development, but you can hop into the Terminal Player to explore, experiment, and get a feel for what we’re building.","blue");
  await typeLine("Use 'help' to explore available commands.","dim");

  await typeLine("────────────────────────────","dim");

  await typeLine("System ready.","green");

  createInput();
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

boot();
</script>

</body>
</html>
