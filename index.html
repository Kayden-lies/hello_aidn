<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIDN</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #0a0f1c;
      color: #ffffff;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 4rem;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 114, 255, 0.5);
    }

    p {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #a0b3d6;
      max-width: 600px;
    }

    .btn {
      margin-top: 30px;
      padding: 12px 30px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 114, 255, 0.5);
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 114, 255, 0.8);
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,114,255,0.2), transparent);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <div class="container">
    <h1>AIDN</h1>
    <p>
      AI-driven network. Building intelligent systems, scalable solutions,
      and the future of connected intelligence.
    </p>
    <button class="btn">Explore</button>
  </div>
</body>
</html>
